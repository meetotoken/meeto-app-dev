<!DOCTYPE html>
<html lang="it" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>$MEETO — Mappa del Patrimonio Culturale</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#0B0E14',
            brandGold: '#D4AF37',
            brandBorder: 'rgba(212, 175, 55, 0.2)',
          }
        }
      }
    }
  </script>
  
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0B0E14;
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
    }
    .glass-panel {
      background: rgba(11, 14, 20, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .leaflet-tile-pane { 
      filter: brightness(0.65) invert(1) contrast(2.8) hue-rotate(200deg) saturate(0.3); 
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col justify-between overflow-hidden">

  <!-- HEADER & BARRA CITTA' & ZOOM ITALIA -->
  <header class="w-full border-b border-brandBorder/30 bg-black/95 backdrop-blur-md px-3 py-2 flex flex-col gap-1.5 z-50 shrink-0">
    <div class="flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-1.5 active:opacity-70 transition">
        <span class="text-lg">🏛️</span>
        <span class="font-bold text-sm text-amber-400 tracking-wide">$MEETO Heritage</span>
      </a>
      <div class="flex items-center gap-1">
        <button onclick="resetItalyView()" class="px-2 py-1 rounded-full text-[11px] font-semibold bg-amber-500/10 text-amber-300 border border-amber-500/30">🇮🇹 Italia</button>
        <button onclick="toggleSuggestModal(true)" class="px-2 py-1 rounded-full text-[11px] font-semibold bg-amber-500/10 text-amber-300 border border-amber-500/30">➕ Segnala</button>
        <button onclick="getUserLocation()" class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-400 text-black shadow-md">🎯 GPS</button>
      </div>
    </div>

    <!-- SELETTORE RAPIDO CAPOLUOGHI & CITTA' D'ARTE -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 no-scrollbar text-xs">
      <button onclick="jumpToSite('colosseo')" class="px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/30 whitespace-nowrap font-medium">🏛️ Roma</button>
      <button onclick="jumpToSite('duomo_milano')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Milano</button>
      <button onclick="jumpToSite('mole_torino')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Torino</button>
      <button onclick="jumpToSite('piazza_san_marco')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Venezia</button>
      <button onclick="jumpToSite('arena_verona')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Verona</button>
      <button onclick="jumpToSite('piazza_duomo_firenze')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Firenze</button>
      <button onclick="jumpToSite('piazza_maggiore')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Bologna</button>
      <button onclick="jumpToSite('piazza_de_ferrari')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Genova</button>
      <button onclick="jumpToSite('piazza_plebiscito')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Napoli</button>
      <button onclick="jumpToSite('basilica_san_nicola')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Bari</button>
      <button onclick="jumpToSite('sassi_matera')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Matera</button>
      <button onclick="jumpToSite('cattedrale_palermo')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Palermo</button>
      <button onclick="jumpToSite('valle_dei_templi')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Agrigento</button>
      <button onclick="jumpToSite('duomo_catania')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Catania</button>
      <button onclick="jumpToSite('parco_neapolis')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Siracusa</button>
      <button onclick="jumpToSite('teatro_greco_taormina')" class="px-2.5 py-0.5 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap font-medium">Taormina</button>
    </div>
  </header>

  <!-- CONTENITORE MAPPA & CARD A SCOMPARSA -->
  <main class="relative flex-1 w-full overflow-hidden">
    <div id="map" class="w-full h-full"></div>
    
    <!-- CARD DETTAGLIO SITO (NASCOSTA DI DEFAULT, SPUNTA AL CLICK DI UN PIN O CITTA') -->
    <div id="heritage-card" class="absolute bottom-3 left-3 right-3 z-20 glass-panel p-3.5 rounded-2xl max-w-md mx-auto shadow-2xl hidden transition-all duration-300">
      <div class="flex justify-between items-start gap-2 mb-1.5">
        <div>
          <span class="text-[9px] text-amber-400 font-mono uppercase tracking-widest font-semibold">Patrimonio Culturale Verificato</span>
          <h3 id="site-title" class="font-bold text-sm text-white">🏛️ Titolo Monumento</h3>
          <p id="site-city" class="text-[11px] text-gray-400">Città</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 shrink-0">+100 XP</span>
          <button onclick="closeHeritageCard()" class="text-gray-400 hover:text-white text-sm font-bold px-1.5 py-0.5 bg-white/5 rounded-full">✕</button>
        </div>
      </div>

      <p id="site-desc" class="text-[11px] text-gray-300 line-clamp-2 mb-2.5 leading-relaxed">
        Descrizione storica del monumento selezionato.
      </p>

      <div class="flex items-center gap-2">
        <a id="wiki-link" href="#" target="_blank" class="flex-1 text-center py-2 rounded-xl text-xs font-semibold bg-white/10 hover:bg-white/20 text-white border border-white/20 flex items-center justify-center gap-1">
          📖 Wikipedia
        </a>
        <button onclick="confirmSiteSelection()" class="flex-1 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-amber-400 to-yellow-600 text-black shadow-lg">
          📍 Attiva per Check-In
        </button>
      </div>
    </div>
  </main>

  <!-- MODALE SEGNALAZIONE -->
  <div id="suggest-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-sm rounded-2xl p-5 border border-amber-500/30 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-amber-400">➕ Segnala Luogo Culturale</h3>
        <button onclick="toggleSuggestModal(false)" class="text-gray-400 hover:text-white text-lg font-bold">✕</button>
      </div>
      <form onsubmit="submitNewSite(event)" class="space-y-3">
        <input id="input-name" type="text" required placeholder="Nome Monumento" class="w-full px-3 py-2 bg-black/60 border border-white/10 rounded-xl text-xs text-white" />
        <input id="input-city" type="text" required placeholder="Città / Regione" class="w-full px-3 py-2 bg-black/60 border border-white/10 rounded-xl text-xs text-white" />
        <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold bg-amber-400 text-black">Invia Proposta</button>
      </form>
    </div>
  </div>

  <!-- BOTTOM BAR NAVIGAZIONE -->
  <nav class="w-full bg-black/95 border-t border-brandBorder/30 backdrop-blur-lg px-6 py-2 flex justify-between items-center text-center z-50 shrink-0">
    <a href="index.html" class="flex flex-col items-center text-gray-400"><span class="text-lg">🏠</span><span class="text-[10px] mt-0.5">Home</span></a>
    <a href="mappa.html" class="flex flex-col items-center text-amber-400"><span class="text-lg">🗺️</span><span class="text-[10px] mt-0.5 font-semibold">Mappa</span></a>
    <a href="social.html" class="flex flex-col items-center text-gray-400"><span class="text-lg">👥</span><span class="text-[10px] mt-0.5">Social</span></a>
    <a href="token.html" class="flex flex-col items-center text-gray-400"><span class="text-lg">🪙</span><span class="text-[10px] mt-0.5">Token</span></a>
  </nav>

  <!-- LOGICA CON CARD DINAMICA A SCOMPARSA -->
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const MONUMENTS = {
      colosseo: { name: "Colosseo & Parco Archeologico", city: "Roma (Lazio)", lat: 41.89021, lng: 12.49223, desc: "Anfiteatro Flavio dell'antica Roma, tra le Sette Meraviglie del Mondo Moderno.", wiki: "https://it.wikipedia.org/wiki/Colosseo" },
      pantheon: { name: "Pantheon", city: "Roma (Lazio)", lat: 41.8986, lng: 12.4769, desc: "Tempio romano dedicato a tutte le divinità, celebre per la sua enorme cupola.", wiki: "https://it.wikipedia.org/wiki/Pantheon_(Roma)" },
      fori_imperiali: { name: "Fori Imperiali", city: "Roma (Lazio)", lat: 41.8925, lng: 12.4862, desc: "Piazza e complesso monumentale del centro politico dell'antica Roma.", wiki: "https://it.wikipedia.org/wiki/Fori_Imperiali" },

      duomo_milano: { name: "Duomo di Milano", city: "Milano (Lombardia)", lat: 45.4641, lng: 9.1919, desc: "Cattedrale gotica imponente, simbolo di Milano, rivestita in marmo di Candoglia.", wiki: "https://it.wikipedia.org/wiki/Duomo_di_Milano" },
      castello_sforzesco: { name: "Castello Sforzesco", city: "Milano (Lombardia)", lat: 45.4705, lng: 9.1790, desc: "Storico castello e fortezza simbolo della signoria sforzesca milanese.", wiki: "https://it.wikipedia.org/wiki/Castello_Sforzesco" },

      mole_torino: { name: "Mole Antonelliana", city: "Torino (Piemonte)", lat: 45.0689, lng: 7.6930, desc: "Monumento simbolo di Torino, sede del Museo Nazionale del Cinema.", wiki: "https://it.wikipedia.org/wiki/Mole_Antonelliana" },
      palazzo_reale_torino: { name: "Palazzo Reale di Torino", city: "Torino (Piemonte)", lat: 45.0728, lng: 7.6855, desc: "Residenza sabauda patrimonio UNESCO nel cuore barocco di Torino.", wiki: "https://it.wikipedia.org/wiki/Palazzo_Reale_di_Torino" },

      piazza_san_marco: { name: "Piazza San Marco & Basilica", city: "Venezia (Veneto)", lat: 45.4342, lng: 12.3385, desc: "L'unica piazza di Venezia, dominata dalla Basilica di San Marco e dal Campanile.", wiki: "https://it.wikipedia.org/wiki/Piazza_San_Marco" },
      arena_verona: { name: "Arena di Verona", city: "Verona (Veneto)", lat: 45.4384, lng: 10.9916, desc: "Anfiteatro romano celebre in tutto il mondo per la sua acustica e la lirica.", wiki: "https://it.wikipedia.org/wiki/Arena_di_Verona" },

      piazza_duomo_firenze: { name: "Piazza del Duomo & Battistero", city: "Firenze (Toscana)", lat: 43.7731, lng: 11.2560, desc: "Cuore rinascimentale di Firenze con la Cattedrale e la Cupola del Brunelleschi.", wiki: "https://it.wikipedia.org/wiki/Piazza_del_Duomo_(Firenze)" },
      uffizi_firenze: { name: "Galleria degli Uffizi", city: "Firenze (Toscana)", lat: 43.7678, lng: 11.2553, desc: "Uno dei musei d'arte più famosi al mondo, scrigno di capolavori rinascimentali.", wiki: "https://it.wikipedia.org/wiki/Galleria_degli_Uffizi" },
      piazza_miracoli_pisa: { name: "Piazza dei Miracoli & Torre Pendente", city: "Pisa (Toscana)", lat: 43.7230, lng: 10.3966, desc: "Celebre complesso monumentale con la Cattedrale e la famosa Torre campanaria.", wiki: "https://it.wikipedia.org/wiki/Piazza_dei_Miracoli" },

      piazza_maggiore: { name: "Piazza Maggiore & San Petronio", city: "Bologna (Emilia-Romagna)", lat: 44.4938, lng: 11.3426, desc: "Il cuore della città medievale di Bologna circondato dai palazzi storici.", wiki: "https://it.wikipedia.org/wiki/Piazza_Maggiore" },
      piazza_de_ferrari: { name: "Piazza De Ferrari & Palazzo Ducale", city: "Genova (Liguria)", lat: 44.4072, lng: 8.9340, desc: "Piazza principale di Genova con la fontana in bronzo e il Palazzo Ducale.", wiki: "https://it.wikipedia.org/wiki/Piazza_De_Ferrari" },

      piazza_plebiscito: { name: "Piazza del Plebiscito & Palazzo Reale", city: "Napoli (Campania)", lat: 40.8359, lng: 14.2488, desc: "Una delle più grandi piazze d'Italia, dominata dal Palazzo Reale.", wiki: "https://it.wikipedia.org/wiki/Piazza_del_Plebiscito_(Napoli)" },
      pompei_scavi: { name: "Parco Archeologico di Pompei", city: "Pompei (Campania)", lat: 40.7506, lng: 14.4856, desc: "Straordinaria testimonianza dell'antica Roma sepolta dall'eruzione del Vesuvio.", wiki: "https://it.wikipedia.org/wiki/Scavi_archeologici_di_Pompei" },

      basilica_san_nicola: { name: "Basilica di San Nicola", city: "Bari (Puglia)", lat: 41.1306, lng: 16.8703, desc: "Capolavoro dell'architettura romanica pugliese nel cuore di Bari Vecchia.", wiki: "https://it.wikipedia.org/wiki/Basilica_di_San_Nicola" },
      sassi_matera: { name: "Sassi di Matera", city: "Matera (Basilicata)", lat: 40.6664, lng: 16.6108, desc: "Architettura rupestre scavata nella calcarenite, abitata fin dalla preistoria e patrimonio UNESCO.", wiki: "https://it.wikipedia.org/wiki/Sassi_di_Matera" },

      cattedrale_palermo: { name: "Cattedrale di Palermo", city: "Palermo (Sicilia)", lat: 38.1145, lng: 13.3561, desc: "Capolavoro arabo-normanno patrimonio UNESCO nel cuore della Sicilia.", wiki: "https://it.wikipedia.org/wiki/Cattedrale_di_Palermo" },
      valle_dei_templi: { name: "Valle dei Templi", city: "Agrigento (Sicilia)", lat: 37.2917, lng: 13.5857, desc: "Parco archeologico della Magna Grecia celebre per il Tempio della Concordia.", wiki: "https://it.wikipedia.org/wiki/Valle_dei_templj" },
      duomo_catania: { name: "Duomo di Catania & Liotru", city: "Catania (Sicilia)", lat: 37.5027, lng: 15.0873, desc: "Cattedrale barocca di Sant'Agata e Fontana dell'Elefante in pietra lavica.", wiki: "https://it.wikipedia.org/wiki/Cattedrale_di_Sant'Agata" },
      teatro_romano_catania: { name: "Teatro Romano e Odeon", city: "Catania (Sicilia)", lat: 37.5015, lng: 15.0838, desc: "Splendido complesso monumentale di età romana incastonato nel barocco.", wiki: "https://it.wikipedia.org/wiki/Teatro_romano_di_Catania" },
      parco_neapolis: { name: "Parco Archeologico della Neapolis", city: "Siracusa (Sicilia)", lat: 37.0755, lng: 15.2866, desc: "Teatro Greco, Anfiteatro Romano e Orecchio di Dionisio.", wiki: "https://it.wikipedia.org/wiki/Parco_archeologico_della_Neapolis" },
      ortigia_siracusa: { name: "Isola di Ortigia & Duomo", city: "Siracusa (Sicilia)", lat: 37.0594, lng: 15.2925, desc: "Cuore storico di Siracusa edificato sull'antico tempio di Atena.", wiki: "https://it.wikipedia.org/wiki/Ortigia" },
      teatro_greco_taormina: { name: "Teatro Antico di Taormina", city: "Taormina (Sicilia)", lat: 37.8514, lng: 15.2845, desc: "Famoso teatro greco-romano con vista mozzafiato sull'Etna e sul mare.", wiki: "https://it.wikipedia.org/wiki/Teatro_antico_di_Taormina" }
    };

    let activeSiteKey = "colosseo";
    let map, markersMap = {};

    window.addEventListener('load', () => {
      map = L.map('map', { zoomControl: false }).setView([41.5, 12.5], 6);
      L.control.zoom({ position: 'topright' }).addTo(map);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      Object.keys(MONUMENTS).forEach(key => {
        const site = MONUMENTS[key];
        const marker = L.marker([site.lat, site.lng]).addTo(map);
        marker.bindPopup(`<b>🏛️ ${site.name}</b><br>${site.city}`);
        markersMap[key] = { marker, site };
        
        marker.on('click', () => {
          selectSiteUI(key, site);
        });
      });

      setTimeout(() => {
        map.invalidateSize();
      }, 300);
    });

    function selectSiteUI(key, site) {
      activeSiteKey = key;
      document.getElementById('site-title').innerText = `🏛️ ${site.name}`;
      document.getElementById('site-city').innerText = site.city;
      document.getElementById('site-desc').innerText = site.desc;
      document.getElementById('wiki-link').href = site.wiki;
      
      // Mostra la card con animazione
      const card = document.getElementById('heritage-card');
      card.classList.remove('hidden');
      
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
    }

    function closeHeritageCard() {
      const card = document.getElementById('heritage-card');
      card.classList.add('hidden');
    }

    function jumpToSite(siteKey) {
      if (MONUMENTS[siteKey]) {
        const site = MONUMENTS[siteKey];
        map.setView([site.lat, site.lng], 13);
        selectSiteUI(siteKey, site);
        if (markersMap[siteKey]) {
          markersMap[siteKey].marker.openPopup();
        }
      }
      setTimeout(() => { map.invalidateSize(); }, 100);
    }

    function resetItalyView() {
      map.setView([41.5, 12.5], 6);
      closeHeritageCard(); // Nasconde la card quando si torna alla vista panoramica dell'Italia
      setTimeout(() => { map.invalidateSize(); }, 100);
    }

    function toggleSuggestModal(show) {
      const modal = document.getElementById('suggest-modal');
      show ? modal.classList.remove('hidden') : modal.classList.add('hidden');
    }

    function submitNewSite(event) {
      event.preventDefault();
      alert("Proposta inviata con successo al team $MEETO!");
      toggleSuggestModal(false);
      event.target.reset();
    }

    function confirmSiteSelection() {
      localStorage.setItem('selected_site', activeSiteKey);
      window.location.href = `index.html?site=${activeSiteKey}`;
    }

    function getUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          map.setView([position.coords.latitude, position.coords.longitude], 13);
          setTimeout(() => { map.invalidateSize(); }, 100);
        }, () => { alert("Attiva il GPS sul tuo smartphone."); });
      }
    }
  </script>
</body>
</html>
