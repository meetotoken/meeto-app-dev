<!DOCTYPE html>
<html lang="it" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>$MEETO — Mappa del Patrimonio Culturale</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandDark: '#0B0E14',
            brandGold: '#D4AF37',
            brandBorder: 'rgba(212, 175, 55, 0.2)',
          }
        }
      }
    }
  </script>
  
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #0B0E14;
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
    }
    #map {
      height: 100%;
      width: 100%;
      z-index: 1;
      touch-action: pan-x pan-y;
    }
    .glass-panel {
      background: rgba(11, 14, 20, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }
    .leaflet-tile-pane { 
      filter: brightness(0.65) invert(1) contrast(2.8) hue-rotate(200deg) saturate(0.3); 
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col justify-between overflow-hidden relative">

  <!-- HEADER & BARRA CITTA' D'ARTE E CAPOLUOGHI -->
  <header class="w-full border-b border-brandBorder/30 bg-black/90 backdrop-blur-md px-4 py-2.5 flex flex-col gap-2 z-50 shrink-0">
    <div class="flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 active:opacity-70 transition">
        <span class="text-xl">🏛️</span>
        <span class="font-bold text-base text-amber-400 tracking-wide">$MEETO Heritage</span>
      </a>
      <button onclick="getUserLocation()" class="px-3 py-1.5 rounded-full text-xs font-bold bg-amber-400 text-black hover:bg-amber-300 active:scale-95 transition flex items-center gap-1 shadow-lg shadow-amber-400/20">
        🎯 Mia Posizione
      </button>
    </div>

    <!-- SELETTORE RAPIDO CITTÀ PRINCIPALI -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar text-xs">
      <button onclick="jumpToCity(41.8902, 12.4922, 13)" class="px-3 py-1 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/30 whitespace-nowrap active:scale-95 transition font-medium">🏛️ Roma</button>
      <button onclick="jumpToCity(45.4641, 9.1919, 14)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">Duomo Milano</button>
      <button onclick="jumpToCity(43.7678, 11.2553, 14)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">🎨 Firenze</button>
      <button onclick="jumpToCity(45.4342, 12.3385, 14)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">🛶 Venezia</button>
      <button onclick="jumpToCity(40.8518, 14.2681, 13)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">🌋 Napoli</button>
      <button onclick="jumpToCity(45.0703, 7.6869, 14)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">Mole Torino</button>
      <button onclick="jumpToCity(44.4949, 11.3426, 14)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">Medioevo Bologna</button>
      <button onclick="jumpToCity(38.1157, 13.3615, 14)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">Palermo</button>
      <button onclick="jumpToCity(45.4384, 10.9916, 14)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">Verona</button>
      <button onclick="jumpToCity(43.7155, 10.3966, 15)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">Pisa</button>
      <button onclick="jumpToCity(43.3188, 11.3308, 15)" class="px-3 py-1 rounded-full bg-white/5 text-gray-300 border border-white/10 whitespace-nowrap active:scale-95 transition font-medium">Siena</button>
    </div>
  </header>

  <!-- MAPPA INTERATTIVA -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <div id="map"></div>
    
    <!-- CARD SCHEDA CULTURALE & SELEZIONE -->
    <div id="heritage-card" class="absolute bottom-16 left-3 right-3 z-20 glass-panel p-4 rounded-2xl max-w-md mx-auto shadow-2xl transition-all">
      <div class="flex justify-between items-start gap-2 mb-2">
        <div>
          <span class="text-[9px] text-amber-400 font-mono uppercase tracking-widest font-semibold">Patrimonio Culturale Verificato</span>
          <h3 id="site-title" class="font-bold text-base text-white">🏛️ Colosseo & Parco Archeologico</h3>
          <p id="site-city" class="text-xs text-gray-400">Roma (Lazio)</p>
        </div>
        <span id="site-reward" class="px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30 shrink-0">
          +100 XP
        </span>
      </div>

      <!-- DESCRIZIONE SINTETICA & WIKIPEDIA -->
      <p id="site-desc" class="text-xs text-gray-300 line-clamp-2 mb-3 leading-relaxed">
        L'Anfiteatro Flavio, conosciuto come Colosseo, è il più grande anfiteatro dell'antica Roma.
      </p>

      <div class="flex items-center gap-2">
        <!-- LINK WIKIPEDIA -->
        <a id="wiki-link" href="https://it.wikipedia.org/wiki/Colosseo" target="_blank" class="flex-1 text-center py-2 rounded-xl text-xs font-semibold bg-white/10 hover:bg-white/20 text-white border border-white/20 active:scale-95 transition flex items-center justify-center gap-1">
          📖 Wikipedia
        </a>
        <!-- PULSANTE SELEZIONE HOME -->
        <button id="select-btn" onclick="confirmSiteSelection()" class="flex-1 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-amber-400 to-yellow-600 text-black active:scale-95 transition shadow-lg shadow-amber-500/10">
          📍 Attiva per Check-In
        </button>
      </div>
    </div>
  </main>

  <!-- BOTTOM BAR NAVIGAZIONE -->
  <nav class="w-full bg-black/95 border-t border-brandBorder/30 backdrop-blur-lg px-6 py-2.5 flex justify-between items-center text-center z-50 shrink-0">
    <a href="index.html" class="flex flex-col items-center text-gray-400 active:text-amber-400">
      <span class="text-xl">🏠</span>
      <span class="text-[10px] mt-0.5">Home</span>
    </a>
    <a href="mappa.html" class="flex flex-col items-center text-amber-400">
      <span class="text-xl">🗺️</span>
      <span class="text-[10px] mt-0.5 font-semibold">Mappa</span>
    </a>
    <a href="social.html" class="flex flex-col items-center text-gray-400 active:text-amber-400">
      <span class="text-xl">👥</span>
      <span class="text-[10px] mt-0.5">Social</span>
    </a>
    <a href="token.html" class="flex flex-col items-center text-gray-400 active:text-amber-400">
      <span class="text-xl">🪙</span>
      <span class="text-[10px] mt-0.5">Token</span>
    </a>
  </nav>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let activeSite = {
      key: "colosseo",
      name: "Colosseo & Parco Archeologico",
      city: "Roma (Lazio)",
      desc: "L'Anfiteatro Flavio, simbolo di Roma nel mondo, costruito tra il 70 e l'80 d.C.",
      wiki: "https://it.wikipedia.org/wiki/Colosseo"
    };

    const map = L.map('map', { zoomControl: false }).setView([41.89021, 12.49223], 6);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // REGISTRO 20 CAPOLUOGHI DI REGIONE CON WIKIPEDIA
    const heritageSites = [
      { key: "colosseo", name: "Colosseo & Parco Archeologico", city: "Roma (Lazio)", lat: 41.89021, lng: 12.49223, desc: "Anfiteatro Flavio dell'antica Roma, inserito tra le Sette Meraviglie del Mondo Moderno.", wiki: "https://it.wikipedia.org/wiki/Colosseo" },
      { key: "pantheon", name: "Pantheon", city: "Roma (Lazio)", lat: 41.8986, lng: 12.4769, desc: "Tempio romano dedicato a tutte le divinità, celebre per la sua enorme cupola ad oculo aperto.", wiki: "https://it.wikipedia.org/wiki/Pantheon_(Roma)" },
      { key: "duomo_milano", name: "Duomo di Milano", city: "Milano (Lombardia)", lat: 45.4641, lng: 9.1919, desc: "Cattedrale gotica imponente, simbolo di Milano, rivestita in marmo di Candoglia.", wiki: "https://it.wikipedia.org/wiki/Duomo_di_Milano" },
      { key: "mole_torino", name: "Mole Antonelliana", city: "Torino (Piemonte)", lat: 45.0689, lng: 7.6930, desc: "Monumento simbolo di Torino, progettato da Alessandro Antonelli, sede del Museo Nazionale del Cinema.", wiki: "https://it.wikipedia.org/wiki/Mole_Antonelliana" },
      { key: "piazza_san_marco", name: "Piazza San Marco", city: "Venezia (Veneto)", lat: 45.4342, lng: 12.3385, desc: "L'unica piazza di Venezia, dominata dalla Basilica di San Marco e dal Campanile.", wiki: "https://it.wikipedia.org/wiki/Piazza_San_Marco" },
      { key: "piazza_duomo_firenze", name: "Piazza del Duomo & Battistero", city: "Firenze (Toscana)", lat: 43.7731, lng: 11.2560, desc: "Cuore rinascimentale di Firenze con la Cattedrale di Santa Maria del Fiore e la Cupola del Brunelleschi.", wiki: "https://it.wikipedia.org/wiki/Piazza_del_Duomo_(Firenze)" },
      { key: "piazza_plebiscito", name: "Piazza del Plebiscito", city: "Napoli (Campania)", lat: 40.8359, lng: 14.2488, desc: "Una delle più grandi piazze d'Italia, dominata dal Palazzo Reale e dalla Basilica di San Francesco di Paola.", wiki: "https://it.wikipedia.org/wiki/Piazza_del_Plebiscito_(Napoli)" },
      { key: "cattedrale_palermo", name: "Cattedrale di Palermo", city: "Palermo (Sicilia)", lat: 38.1145, lng: 13.3561, desc: "Capolavoro arabo-normanno patrimonio UNESCO, testimone delle influenze culturali della Sicilia.", wiki: "https://it.wikipedia.org/wiki/Cattedrale_di_Palermo" },
      { key: "piazza_maggiore", name: "Piazza Maggiore", city: "Bologna (Emilia-Romagna)", lat: 44.4938, lng: 11.3426, desc: "Il cuore della città medievale di Bologna, circondata dalla Basilica di San Petronio e dai palazzi storici.", wiki: "https://it.wikipedia.org/wiki/Piazza_Maggiore" },
      { key: "piazza_de_ferrari", name: "Piazza De Ferrari", city: "Genova (Liguria)", lat: 44.4072, lng: 8.9340, desc: "La piazza principale di Genova con la sua monumentale fontana in bronzo e il Palazzo Ducale.", wiki: "https://it.wikipedia.org/wiki/Piazza_De_Ferrari" },
      { key: "basilica_san_nicola", name: "Basilica di San Nicola", city: "Bari (Puglia)", lat: 41.1306, lng: 16.8703, desc: "Capolavoro dell'architettura romanica pugliese, custodisce le reliquie di San Nicola.", wiki: "https://it.wikipedia.org/wiki/Basilica_di_San_Nicola" },
      { key: "museo_riace", name: "Museo Archeologico Nazionale", city: "Reggio Calabria (Calabria)", lat: 38.1148, lng: 15.6511, desc: "Sede dei celebri Bronzi di Riace, capolavori della scultura greca del V secolo a.C.", wiki: "https://it.wikipedia.org/wiki/Museo_nazionale_della_Magna_Grecia" },
      { key: "bastione_saint_remy", name: "Bastione di Saint Remy", city: "Cagliari (Sardegna)", lat: 39.2163, lng: 9.1171, desc: "Imponente fortificazione neoclassica che domina il quartiere storico di Castello.", wiki: "https://it.wikipedia.org/wiki/Bastione_di_Saint_Remy" },
      { key: "piazza_unita", name: "Piazza Unità d'Italia", city: "Trieste (Friuli-V.G.)", lat: 45.6501, lng: 13.7678, desc: "La più grande piazza sul mare d'Europa, incorniciata da palazzi storici in stile neoclassico.", wiki: "https://it.wikipedia.org/wiki/Piazza_Unità_d'Italia" },
      { key: "piazza_duomo_trento", name: "Piazza Duomo", city: "Trento (Trentino-A.A.)", lat: 46.0678, lng: 11.1215, desc: "Caratteristica piazza rinascimentale dominata dalla Fontana del Nettuno e dalla Cattedrale di San Vigilio.", wiki: "https://it.wikipedia.org/wiki/Piazza_Duomo_(Trento)" },
      { key: "piazza_iv_novembre", name: "Piazza IV Novembre", city: "Perugia (Umbria)", lat: 43.1107, lng: 12.3890, desc: "Piazza medievale al cui centro si erge la Fontana Maggiore, capolavoro di Nicola e Giovanni Pisano.", wiki: "https://it.wikipedia.org/wiki/Piazza_IV_Novembre" },
      { key: "piazza_plebiscito_ancona", name: "Piazza del Plebiscito", city: "Ancona (Marche)", lat: 43.6183, lng: 13.5152, desc: "Detta anche Piazza del Papa, una delle piazze storiche più suggestive del capoluogo marchigiano.", wiki: "https://it.wikipedia.org/wiki/Piazza_del_Plebiscito_(Ancona)" },
      { key: "piazza_duomo_laquila", name: "Piazza del Duomo", city: "L'Aquila (Abruzzo)", lat: 42.3498, lng: 13.3995, desc: "Cuore sociale e commerciale dell'Aquila, dominata dalla Cattedrale dei Santi Massimo e Giorgio.", wiki: "https://it.wikipedia.org/wiki/Piazza_del_Duomo_(L'Aquila)" },
      { key: "castello_monforte", name: "Castello Monforte", city: "Campobasso (Molise)", lat: 41.5604, lng: 14.6592, desc: "Fortezza medievale situata sulla collina che sovrasta l'intera città di Campobasso.", wiki: "https://it.wikipedia.org/wiki/Castello_Monforte" },
      { key: "sassi_matera", name: "Sassi di Matera", city: "Matera / Potenza (Basilicata)", lat: 40.6664, lng: 16.6108, desc: "Architettura rupestre scavata nella calcarenite, abitata fin dalla preistoria e patrimonio UNESCO.", wiki: "https://it.wikipedia.org/wiki/Sassi_di_Matera" },
      { key: "teatro_romano_aosta", name: "Teatro Romano", city: "Aosta (Valle d'Aosta)", lat: 45.7383, lng: 7.3228, desc: "Imponente testimonianza dell'epoca romana con la facciata alta 22 metri ancora conservata.", wiki: "https://it.wikipedia.org/wiki/Teatro_romano_di_Aosta" }
    ];

    heritageSites.forEach(site => {
      const marker = L.marker([site.lat, site.lng]).addTo(map);
      
      marker.on('click', () => {
        activeSite = site;
        document.getElementById('site-title').innerText = `🏛️ ${site.name}`;
        document.getElementById('site-city').innerText = site.city;
        document.getElementById('site-desc').innerText = site.desc;
        document.getElementById('wiki-link').href = site.wiki;
        
        if (window.Telegram?.WebApp?.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
      });
    });

    function jumpToCity(lat, lng, zoom) {
      map.setView([lat, lng], zoom);
      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
      }
    }

    function confirmSiteSelection() {
      localStorage.setItem('selected_site', activeSite.key);

      if (window.Telegram?.WebApp?.HapticFeedback) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      }

      window.location.href = `index.html?site=${activeSite.key}`;
    }

    function getUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;
          map.setView([userLat, userLng], 14);
          
          L.circle([userLat, userLng], { 
            radius: 200, 
            color: '#D4AF37', 
            fillColor: '#D4AF37', 
            fillOpacity: 0.25 
          }).addTo(map);
        }, () => {
          alert("Attiva i permessi GPS sul tuo smartphone.");
        });
      }
    }
  </script>
</body>
</html>
